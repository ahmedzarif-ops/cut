kind = "api"
previewPath = "/"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/"]

[services.development]
run = "corepack pnpm@10.34.5 --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["corepack", "pnpm@10.34.5", "run", "build:production"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# Sole production process: API, Clerk proxy, landing, legal, support, and status
# all share this one platform-provided PORT.
args = ["corepack", "pnpm@10.34.5", "run", "start:production"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
# Required deployment input: API_MAX_INSTANCES. It is intentionally not
# defaulted; production accepts only a provider-verified maximum of 1.

[services.production.health.startup]
path = "/api/readyz"
