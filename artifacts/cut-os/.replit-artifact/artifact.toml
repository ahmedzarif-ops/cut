kind = "mobile"
previewPath = "/"
title = "CUT OS"
version = "1.0.0"
id = "artifacts/cut-os"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22203

[services.development]
run = "corepack pnpm --filter @workspace/cut-os run dev"

# This artifact is development/preview only. Production is intentionally owned
# by the API artifact's single listener, which mounts these source-controlled
# launch/legal routes in-process. Keeping a second production service here
# would create a competing PORT listener on a one-machine Reserved VM.

[services.env]
PORT = "22203"
BASE_PATH = "/"
