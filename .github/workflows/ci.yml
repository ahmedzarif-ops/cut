name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Test and scan the tracked-source secret boundary
        run: |
          node --test ops/scripts/secret-boundary-scan.test.mjs
          node ops/scripts/secret-boundary-scan.mjs tracked
      - run: pnpm install --frozen-lockfile
      - name: Reject high-severity runtime and build dependency advisories
        run: pnpm audit --audit-level high
      - run: pnpm run codegen:check
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: Validate working App Store submission artifacts
        run: pnpm run validate:app-store
      - name: Build and smoke-test the single-host production bundle
        run: pnpm run dry-run:production
      - name: Verify the Replit production public-site build contract
        env:
          LEGAL_SITE_PUBLICATION_STATUS: draft
          NODE_ENV: production
          PUBLIC_APP_ORIGIN: https://ci.cutos.app
        run: |
          pnpm --filter @workspace/cut-os run build
          test ! -e artifacts/cut-os/static-build
      - name: Verify committed database migrations match the schema
        run: |
          pnpm --filter @workspace/db run generate
          git diff --exit-code -- lib/db/migrations
          test -z "$(git status --porcelain --untracked-files=all -- lib/db/migrations)"
      - name: Verify Expo dependencies and project health
        run: |
          pnpm --filter @workspace/cut-os exec expo install --check
          pnpm --filter @workspace/cut-os exec expo-doctor
      - name: Verify draft legal hosting remains fail closed
        run: pnpm --filter @workspace/cut-os run validate:legal-site
      - name: Prepare a non-secret production bundle fixture
        shell: bash
        run: |
          clerk_frontend="$(node -p "Buffer.from('clerk.ci.example.com$').toString('base64').replace(/=+$/, '')")"
          {
            echo "EAS_BUILD_PROFILE=production"
            echo "EXPO_PUBLIC_DOMAIN=api.example.com"
            echo "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_live_${clerk_frontend}"
            echo "EXPO_PUBLIC_CLERK_PROXY_URL=https://api.example.com/api/__clerk"
            echo "EXPO_PUBLIC_REVENUECAT_IOS_API_KEY=appl_PublicIosKey1234"
            echo "EXPO_PUBLIC_REVENUECAT_PRODUCT_ID=com.zarifahmed.cut.pro.monthly"
            echo "EXPO_PUBLIC_PRIVACY_POLICY_URL=https://api.example.com/privacy"
            echo "EXPO_PUBLIC_TERMS_URL=https://api.example.com/terms"
            echo "EXPO_PUBLIC_SUPPORT_URL=https://api.example.com/support"
          } >> "$GITHUB_ENV"
      - name: Validate and bundle the production iOS app
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const path = "app-store/app-store-submission.json";
          const record = JSON.parse(readFileSync(path, "utf8"));
          record.subscription.productId = "com.zarifahmed.cut.pro.monthly";
          record.subscription.introductoryOfferDecision = "none";
          record.listing.privacyPolicyUrl = "https://api.example.com/privacy";
          record.listing.termsUrl = "https://api.example.com/terms";
          record.listing.supportUrl = "https://api.example.com/support";
          writeFileSync(path, `${JSON.stringify(record, null, 2)}\n`, "utf8");
          NODE
          pnpm --filter @workspace/cut-os run validate:release-config
          git restore --source=HEAD -- app-store/app-store-submission.json
          test -z "$(git status --porcelain --untracked-files=all)"
          pnpm --filter @workspace/cut-os exec expo config --type introspect > /dev/null
          pnpm --filter @workspace/cut-os exec expo export --platform ios --output-dir "$RUNNER_TEMP/cut-ios-export"
          node ops/scripts/secret-boundary-scan.mjs archive "$RUNNER_TEMP/cut-ios-export"

  release-evidence:
    name: Release evidence boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A public-release evidence transition is the second evidence commit:
          # BUILD_SHA -> app_review -> public_release.
          # Full history is also required to prove the candidate contains the
          # current PR base, or that a push to main was non-force-forward.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0

      - name: Detect an approved App Store evidence commit
        id: release-state
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const submission = JSON.parse(
            readFileSync("app-store/app-store-submission.json", "utf8"),
          );
          const required = submission.status === "approved_for_submission";
          appendFileSync(process.env.GITHUB_OUTPUT, `required=${required}\n`);
          NODE

      - name: Validate the exact approved release evidence commit
        if: steps.release-state.outputs.required == 'true'
        run: node scripts/app-store/validate.mjs --release

      - name: Confirm the release candidate contains required main history
        if: steps.release-state.outputs.required == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GIT_REF: ${{ github.ref }}
        run: node ops/scripts/release-main-ancestry-verify.mjs

      - name: Confirm release evidence is not yet required
        if: steps.release-state.outputs.required != 'true'
        run: echo "Release evidence boundary is pending owner approval."
