openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CUT OS API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: me
    description: Current authenticated user
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get the current authenticated user
      description: >-
        Returns the existing eligible internal user record for the
        authenticated Clerk identity. Normal private endpoints never create an
        unverified user.
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/AdultEligibilityDenied"
        "428":
          $ref: "#/components/responses/AdultEligibilityRequired"
        "410":
          $ref: "#/components/responses/AccountDeletionBlocked"
    patch:
      operationId: updateMe
      tags: [me]
      summary: Update the current user's account settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/AdultEligibilityDenied"
        "428":
          $ref: "#/components/responses/AdultEligibilityRequired"
        "410":
          $ref: "#/components/responses/AccountDeletionBlocked"
    delete:
      operationId: deleteMe
      tags: [me]
      summary: Permanently delete the current user's account
      description: >-
        Durably tombstones the account, deletes the Clerk identity through the
        server, and then removes the local user, profile, weigh-ins, and meal
        history. A 204 is returned only after identity deletion and the local
        cascade are terminal. A 503 means terminal completion could not be
        confirmed; retry/status recovery is required, and any request that was
        successfully staged remains durable for server retry.
      responses:
        "204":
          description: Identity and local CUT OS account data are deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Deletion could not be confirmed; retry or status recovery is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me/account-deletion:
    get:
      operationId: getAccountDeletionStatus
      tags: [me]
      summary: Get the current identity's account-deletion status
      description: >-
        Checks durable deletion state without creating an internal user.
        Normal authenticated endpoints return 410 while deletion is pending or
        completed, preventing a valid stale token from recreating the account.
      responses:
        "200":
          description: Durable account-deletion status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionStatus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Deletion status is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me/adult-eligibility:
    get:
      operationId: getMyAdultEligibility
      tags: [me]
      summary: Get the current identity's adult-eligibility status
      description: >-
        Checks the versioned 18+ eligibility boundary without creating an
        internal user. This route remains available before normal private
        access is allowed.
      responses:
        "200":
          description: Current adult-eligibility status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdultEligibilityStatus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          $ref: "#/components/responses/AccountDeletionBlocked"
    put:
      operationId: decideMyAdultEligibility
      tags: [me]
      summary: Evaluate and persist the current identity's adult eligibility
      description: >-
        Uses the server UTC date to evaluate the submitted birth date under the
        current policy. The birth date is transient and is never persisted or
        returned. The first decision for the current policy is monotonic.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdultEligibilityInput"
      responses:
        "200":
          description: Adult eligibility confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdultEligibilityStatus"
        "400":
          description: Invalid or impossible birth date or missing attestation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/AdultEligibilityDenied"
        "409":
          description: The submitted eligibility policy version is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdultEligibilityBlockedError"
        "410":
          $ref: "#/components/responses/AccountDeletionBlocked"
  /me/profile:
    get:
      operationId: getMyProfile
      tags: [me]
      summary: Get the current user's profile
      responses:
        "200":
          description: The user's profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile not created yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/AdultEligibilityDenied"
        "428":
          $ref: "#/components/responses/AdultEligibilityRequired"
        "410":
          $ref: "#/components/responses/AccountDeletionBlocked"
    put:
      operationId: upsertMyProfile
      tags: [me]
      summary: Create or replace the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: The saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/AdultEligibilityDenied"
        "428":
          $ref: "#/components/responses/AdultEligibilityRequired"
        "410":
          $ref: "#/components/responses/AccountDeletionBlocked"
  /me/today:
    get:
      operationId: getToday
      tags: [me]
      summary: Get the current user's Today state
      responses:
        "200":
          description: Today's next action and weigh-in state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayState"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/AdultEligibilityDenied"
        "428":
          $ref: "#/components/responses/AdultEligibilityRequired"
        "410":
          $ref: "#/components/responses/AccountDeletionBlocked"
  /me/meal-options:
    get:
      operationId: listMyMealOptions
      tags: [me]
      summary: List ranked balanced-meal options
      description: >-
        Returns the versioned meal catalog in a general balanced-meal order.
        Options include declared ingredients and common allergens, but are not
        personalized medical or allergy advice.
      responses:
        "200":
          description: Ranked meal options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MealOption"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/AdultEligibilityDenied"
        "428":
          $ref: "#/components/responses/AdultEligibilityRequired"
        "410":
          $ref: "#/components/responses/AccountDeletionBlocked"
  /me/meals/today:
    get:
      operationId: getTodayMeals
      tags: [me]
      summary: Get today's logged meals and nutrition totals
      responses:
        "200":
          description: Meals for the user's current local calendar day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayMeals"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/AdultEligibilityDenied"
        "428":
          $ref: "#/components/responses/AdultEligibilityRequired"
        "410":
          $ref: "#/components/responses/AccountDeletionBlocked"
  /me/meal-entries:
    post:
      operationId: createMyMealEntry
      tags: [me]
      summary: Log a catalog meal for today
      description: >-
        The client echoes the dayKey and catalogVersion it reviewed, while the
        server remains authoritative for the user's local calendar day and
        copies the selected template's per-serving nutrition into the
        historical entry. Repeating the same clientRequestId and payload
        returns the original entry, even after that day or catalog release is
        superseded. A request UUID remains consumed if its meal is later
        deleted, preventing a delayed replay from recreating it. A new entry
        must match both the current server day and the current catalog version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealEntryInput"
      responses:
        "201":
          description: The logged meal, or the original result of an identical retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealEntry"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/AdultEligibilityDenied"
        "428":
          $ref: "#/components/responses/AdultEligibilityRequired"
        "404":
          description: Meal template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The idempotency key was already used for another payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description: >-
            The reviewed local day/catalog is stale or this request was already
            deleted; refresh meal state and require review before logging
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          $ref: "#/components/responses/AccountDeletionBlocked"
  /me/meal-entries/{mealEntryId}:
    parameters:
      - in: path
        name: mealEntryId
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateMyMealEntry
      tags: [me]
      summary: Update a logged meal's serving count
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealEntryUpdate"
      responses:
        "200":
          description: The updated logged meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealEntry"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/AdultEligibilityDenied"
        "428":
          $ref: "#/components/responses/AdultEligibilityRequired"
        "404":
          description: Meal entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          $ref: "#/components/responses/AccountDeletionBlocked"
    delete:
      operationId: deleteMyMealEntry
      tags: [me]
      summary: Delete a logged meal
      responses:
        "204":
          description: Meal entry deleted
        "400":
          description: Invalid meal entry ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/AdultEligibilityDenied"
        "428":
          $ref: "#/components/responses/AdultEligibilityRequired"
        "410":
          $ref: "#/components/responses/AccountDeletionBlocked"
  /me/weight-entries:
    get:
      operationId: listMyWeightEntries
      tags: [me]
      summary: List the current user's recent weigh-ins
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            multipleOf: 1
            minimum: 1
            maximum: 90
            default: 14
      responses:
        "200":
          description: Recent weigh-ins, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeightEntry"
        "400":
          description: Invalid weight history query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/AdultEligibilityDenied"
        "428":
          $ref: "#/components/responses/AdultEligibilityRequired"
        "410":
          $ref: "#/components/responses/AccountDeletionBlocked"
  /me/weight-entries/today:
    put:
      operationId: upsertTodayWeight
      tags: [me]
      summary: Create or replace today's weigh-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightEntryInput"
      responses:
        "200":
          description: Today's saved weigh-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightEntry"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/AdultEligibilityDenied"
        "428":
          $ref: "#/components/responses/AdultEligibilityRequired"
        "410":
          $ref: "#/components/responses/AccountDeletionBlocked"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    AccountDeletionBlocked:
      description: Account deletion is pending or complete; private access is blocked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdultEligibilityRequired:
      description: A current-policy adult-eligibility decision is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdultEligibilityBlockedError"
    AdultEligibilityDenied:
      description: The authenticated identity is not eligible for adult access
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdultEligibilityBlockedError"
  schemas:
    AdultEligibilityStatus:
      type: object
      additionalProperties: false
      required: [status, minimumAge, policyVersion]
      properties:
        status:
          type: string
          enum: [unverified, eligible, ineligible, review_required]
        minimumAge:
          type: integer
          enum: [18]
        policyVersion:
          type: string
          enum: [adult-18-v1]
    AdultEligibilityInput:
      type: object
      additionalProperties: false
      required: [dateOfBirth, policyVersion, adultAttestation]
      properties:
        dateOfBirth:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        policyVersion:
          type: string
          minLength: 1
        adultAttestation:
          type: boolean
          enum: [true]
    AdultEligibilityBlockedError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - adult_eligibility_required
            - adult_eligibility_denied
            - adult_eligibility_policy_changed
    AccountDeletionStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [none, pending, completed]
    NextAction:
      type: object
      required: [kind, title, detail]
      properties:
        kind:
          type: string
          enum: [complete_onboarding, weigh_in, first_meal, review_meals]
        title:
          type: string
        detail:
          type: string
    WeightEntry:
      type: object
      required: [id, userId, recordedOn, weightKg, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        recordedOn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        weightKg:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WeightEntryInput:
      type: object
      required: [weightKg]
      properties:
        weightKg:
          type: number
          minimum: 20
          maximum: 500
    TodayState:
      type: object
      required: [dayKey, nextAction, weightEntry, mealCount, nutritionTotals]
      properties:
        dayKey:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        nextAction:
          $ref: "#/components/schemas/NextAction"
        weightEntry:
          oneOf:
            - $ref: "#/components/schemas/WeightEntry"
            - type: "null"
        mealCount:
          type: integer
          minimum: 0
        nutritionTotals:
          $ref: "#/components/schemas/Nutrition"
    Nutrition:
      type: object
      required: [caloriesKcal, proteinG, carbsG, fatG, fiberG]
      properties:
        caloriesKcal:
          type: number
          minimum: 0
        proteinG:
          type: number
          minimum: 0
        carbsG:
          type: number
          minimum: 0
        fatG:
          type: number
          minimum: 0
        fiberG:
          type: number
          minimum: 0
    MealOption:
      type: object
      required:
        - id
        - catalogVersion
        - name
        - description
        - cuisine
        - servingDescription
        - dietaryTags
        - ingredients
        - allergens
        - caloriesKcal
        - proteinG
        - carbsG
        - fatG
        - fiberG
        - fitReason
      properties:
        id:
          type: string
        catalogVersion:
          type: string
          minLength: 1
        name:
          type: string
        description:
          type: string
        cuisine:
          type: string
        servingDescription:
          type: string
        dietaryTags:
          type: array
          items:
            type: string
        ingredients:
          type: array
          items:
            type: string
        allergens:
          type: array
          items:
            type: string
        caloriesKcal:
          type: number
          minimum: 0
        proteinG:
          type: number
          minimum: 0
        carbsG:
          type: number
          minimum: 0
        fatG:
          type: number
          minimum: 0
        fiberG:
          type: number
          minimum: 0
        fitReason:
          type: string
    MealEntry:
      type: object
      required:
        - id
        - catalogVersion
        - templateId
        - clientRequestId
        - name
        - servingDescription
        - loggedOn
        - servings
        - caloriesKcal
        - proteinG
        - carbsG
        - fatG
        - fiberG
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        catalogVersion:
          type: string
          minLength: 1
        templateId:
          type: string
        clientRequestId:
          type: string
          format: uuid
        name:
          type: string
        servingDescription:
          type: string
        loggedOn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        servings:
          type: number
          minimum: 0.25
          maximum: 4
        caloriesKcal:
          type: number
          minimum: 0
        proteinG:
          type: number
          minimum: 0
        carbsG:
          type: number
          minimum: 0
        fatG:
          type: number
          minimum: 0
        fiberG:
          type: number
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MealEntryInput:
      type: object
      additionalProperties: false
      required:
        [clientRequestId, catalogVersion, dayKey, mealTemplateId, servings]
      properties:
        clientRequestId:
          type: string
          format: uuid
        catalogVersion:
          type: string
          minLength: 1
        dayKey:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        mealTemplateId:
          type: string
          minLength: 1
        servings:
          type: number
          minimum: 0.25
          maximum: 4
    MealEntryUpdate:
      type: object
      additionalProperties: false
      required: [servings]
      properties:
        servings:
          type: number
          minimum: 0.25
          maximum: 4
    TodayMeals:
      type: object
      required: [dayKey, entries, totals]
      properties:
        dayKey:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        entries:
          type: array
          items:
            $ref: "#/components/schemas/MealEntry"
        totals:
          $ref: "#/components/schemas/Nutrition"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    User:
      type: object
      required:
        - id
        - timezone
        - units
        - onboardingComplete
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: ["string", "null"]
        timezone:
          type: string
        units:
          type: string
          enum: [metric, imperial]
        onboardingComplete:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserUpdate:
      type: object
      properties:
        timezone:
          type: string
          minLength: 1
        units:
          type: string
          enum: [metric, imperial]
        onboardingComplete:
          type: boolean
    Profile:
      type: object
      required:
        - id
        - userId
        - goal
        - sex
        - activityLevel
        - trainingExperience
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        displayName:
          type: ["string", "null"]
        goal:
          type: string
          enum: [cut, maintain, recomp, gain]
        sex:
          type: string
          enum: [male, female, other, unspecified]
        heightCm:
          type: ["number", "null"]
        startWeightKg:
          type: ["number", "null"]
        goalWeightKg:
          type: ["number", "null"]
        targetDate:
          type: ["string", "null"]
          description: Calendar date in YYYY-MM-DD form (no time component).
        activityLevel:
          type: string
          enum: [sedentary, light, moderate, active, very_active]
        trainingExperience:
          type: string
          enum: [beginner, intermediate, advanced]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProfileInput:
      type: object
      required:
        - goal
      properties:
        displayName:
          type: string
        goal:
          type: string
          enum: [cut, maintain, recomp, gain]
        sex:
          type: string
          enum: [male, female, other, unspecified]
        heightCm:
          type: number
          minimum: 50
          maximum: 300
        startWeightKg:
          type: number
          minimum: 20
          maximum: 500
        goalWeightKg:
          type: number
          minimum: 20
          maximum: 500
        targetDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Calendar date in YYYY-MM-DD form (no time component).
        activityLevel:
          type: string
          enum: [sedentary, light, moderate, active, very_active]
        trainingExperience:
          type: string
          enum: [beginner, intermediate, advanced]
